name: FiscalizaGov - Notificar (DOU)

on:
  schedule:
    # 08:00 Brasília = 11:00 UTC (Brasil sem horário de verão)
    - cron: "0 11 * * 1-6"
  workflow_dispatch:
    inputs:
      data:
        description: "Data do DOU (AAAA-MM-DD). Vazio = hoje."
        required: false

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run notifier
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FISCALIZAGOV_DATE: ${{ github.event.inputs.data }}
          # Opcional:
          # FISCALIZAGOV_TERMS: "imposto,tribut,contribui,benefício,programa,decreto,portaria"
        run: python notificar_fiscalizagov.py
