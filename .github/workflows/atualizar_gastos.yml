name: FiscalizaGov - Atualizar gastos (noturno)

on:
  schedule:
    # 04:00 Brasília = 07:00 UTC (madrugada: limite de requisições da API é maior)
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-gastos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install requests pandas tzdata

      - name: Coletar gastos (ano atual e anterior)
        env:
          TRANSPARENCIA_API_KEY: ${{ secrets.TRANSPARENCIA_API_KEY }}
        run: python scripts/atualizar_gastos.py

      - name: Gravar no repositório (só se mudou)
        run: |
          git config user.name "fiscalizagov-bot"
          git config user.email "fiscalizagov-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Atualiza gastos (snapshot noturno)"
            git pull --rebase origin main
            git push
          fi
